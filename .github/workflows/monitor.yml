name: continuous-monitoring

# Phase 1 (research-harness-template#424, ADR-0019): run the monitoring
# pipeline (Source Connectors -> Interest-Inference -> Recommendation
# Engine) for every topic that opts in via harness.config.json's
# continuousMonitoring.enabled, then open ONE review PR per topic. That PR
# IS the Editorial Gate (research-harness-template#422): merging it is the
# accept path, closing it without merge is the reject path. Phase 2
# (monitor-gate.yml) reacts to that PR closing and does the actual
# publish/reject-logging -- this workflow never calls editorial-gate.sh or
# output-router.sh itself.
#
# NOTE on the app token below: mirrors ci.yml's App-token pattern per
# ADR-0019, but this job requests WRITE scopes (contents, pull-requests)
# that ci.yml's read-only CI app may not have installed -- confirm with an
# org admin before relying on this in production, or provision a dedicated
# app per the org's six-app least-privilege model
# (repos/.github/docs/onboarding/app/).
on:
  schedule:
    # Placeholder cadence; each topic's own continuousMonitoring.schedule
    # in harness.config.json is the source of truth for whether a given
    # topic actually runs on a given trigger (checked in the "resolve
    # topics" step below). GitHub Actions supports only one schedule
    # cadence per workflow, so this fires more often than any single
    # topic's cron and the per-topic check filters it down.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic id to run (omit for all enabled topics)'
        required: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: "Mint an app token (write: contents, pull-requests)"
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CI_CLIENT_APP_ID }}
          private-key: ${{ secrets.CI_CLIENT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: research-harness-template
          permission-contents: write
          permission-pull-requests: write

      - name: fetch the mif-rh engine (ADR-0016)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash scripts/fetch-engine.sh

      - name: vendor enabled domain ontologies (ADR-0012)
        run: bash scripts/fetch-ontology.sh --all-enabled

      - name: resolve topics to run and check each one's schedule
        id: resolve
        run: |
          INPUT_TOPIC="${{ github.event.inputs.topic }}"
          if [ -n "$INPUT_TOPIC" ]; then
            TOPICS="$INPUT_TOPIC"
          else
            TOPICS="$(jq -r '.topics[] | select(.continuousMonitoring.enabled == true) | .id' harness.config.json)"
          fi
          {
            echo "topics<<MONITOR_EOF"
            echo "$TOPICS"
            echo "MONITOR_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: run the monitoring pipeline per topic and open review PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          RUN_ID="run-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}"
          git config user.name "research-harness-template[bot]"
          git config user.email "research-harness-template[bot]@users.noreply.github.com"

          while IFS= read -r topic; do
            [ -n "$topic" ] || continue
            echo "::group::monitoring run for $topic"
            bash scripts/monitoring/run-monitoring.sh "$topic" "$RUN_ID" || {
              echo "monitor.yml: run-monitoring.sh failed for $topic, skipping PR" >&2
              echo "::endgroup::"
              continue
            }

            REC_FILE="reports/$topic/monitoring/runs/$RUN_ID/recommendations.json"
            [ -f "$REC_FILE" ] || { echo "::endgroup::"; continue; }
            COUNT="$(jq 'length' "$REC_FILE")"
            if [ "$COUNT" -eq 0 ]; then
              echo "monitor.yml: no recommendations for $topic this run, nothing to review"
              echo "::endgroup::"
              continue
            fi

            BRANCH="monitor/$topic/$RUN_ID"
            git checkout -b "$BRANCH"
            git add "reports/$topic/monitoring/runs/$RUN_ID" reports/concordance.json "reports/$topic/research-index.json"
            git commit -m "monitor($topic): $COUNT candidate recommendation(s), $RUN_ID"
            git push origin "$BRANCH"

            PR_BODY_FILE="$(mktemp)"
            jq -r '.[] | "- **" + (.title // ("gap: " + .dimension)) + "** (" + .mode + ", score " + ((.score // .finding_count // 0) | tostring) + ")"' "$REC_FILE" > "$PR_BODY_FILE"
            {
              echo ""
              echo "Merging this PR accepts every recommendation above (Editorial Gate accept path). Closing it without merging rejects all of them (logged to the Continuity Log)."
            } >> "$PR_BODY_FILE"

            gh pr create \
              --title "monitor($topic): $COUNT candidate recommendation(s) for review" \
              --body-file "$PR_BODY_FILE" \
              --base main --head "$BRANCH" --label "continuous-monitoring"
            rm -f "$PR_BODY_FILE"
            echo "::endgroup::"
          done <<< "${{ steps.resolve.outputs.topics }}"
