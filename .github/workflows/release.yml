name: release

# Attested delivery for the research-harness template.
#
# The release artifact is a REPRODUCIBLE source tarball built with `git archive`
# from the tagged commit tree (no build toolchain, deterministic bytes). It is
# attested with SLSA build provenance via actions/attest-build-provenance — the
# attestation's signer identity is THIS workflow (sigstore/cosign under the
# hood), so a consumer re-verifies with (pin the signer for the strict check):
#
#   gh attestation verify <artifact>.tar.gz \
#     --repo <owner>/<repo> \
#     --signer-workflow <owner>/<repo>/.github/workflows/release.yml
#
# `workflow_dispatch` exercises build -> attest as a dry-run without cutting a
# version; the upload-to-release step runs ONLY on a published release. The
# workflow never creates or publishes a release itself.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Fail-closed: a published release must carry a non-empty CHANGELOG entry for
  # its version. Skips cleanly on a workflow_dispatch dry-run (no release tag).
  changelog-check:
    uses: modeled-information-format/.github/.github/workflows/reusable-changelog-check.yml@824b7ba80c0f798bf1be1d4b776e3688b89152fc
    with:
      version: ${{ github.event.release.tag_name }}

  attest-release:
    needs: changelog-check
    runs-on: ubuntu-latest
    permissions:
      id-token: write       # OIDC token for keyless signing
      attestations: write   # write the provenance attestation
      contents: read        # checkout + verify; the release upload now uses the release App token
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build reproducible source tarball
        id: build
        run: |
          set -euo pipefail
          NAME="${GITHUB_REPOSITORY##*/}"
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dryrun-${GITHUB_SHA::7}"
          fi
          ARTIFACT="${NAME}-${VERSION}.tar.gz"
          # git archive is deterministic from the commit tree and gzip -n drops
          # the timestamp; the tarball is reproducible for a given git version and
          # OS (the gzip OS byte and tar header format can differ across
          # platforms). The attestation binds whatever bytes this run produced.
          git archive --format=tar --prefix="${NAME}-${VERSION}/" HEAD \
            | gzip -n > "${ARTIFACT}"
          echo "artifact=${ARTIFACT}" >> "${GITHUB_OUTPUT}"
          echo "Built ${ARTIFACT}"
          sha256sum "${ARTIFACT}"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.build.outputs.artifact }}

      - name: Verify attestation (fail-closed, before publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Re-verify the just-created provenance. --repo scopes trust to this
          # repository; --signer-workflow additionally pins it to THIS release
          # workflow (the certificate identity), so an attestation from any other
          # workflow in the repo would not pass. A failure here fails the job, so
          # the publish step below never runs unverified.
          gh attestation verify "${{ steps.build.outputs.artifact }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml"

      - name: Mint release app token (publish identity)
        id: release_token
        if: github.event_name == 'release'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_APP_ID }}
          private-key: ${{ secrets.RELEASE_CLIENT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # Down-scope the minted token: the release upload only needs contents:write.
          permission-contents: write

      - name: Upload attested artifact to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ steps.release_token.outputs.token }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" \
            "${{ steps.build.outputs.artifact }}" --clobber

  # #397: surfaces CHANGELOG heading-bracket/footer-link drift for the
  # version just released, without gating any other PR (this job doesn't
  # `needs:` anything and nothing `needs:` it) or auto-committing back to
  # main — reconciliation is a separate, hand-reviewed follow-up PR (the same
  # fix the operator previously made by hand for research-harness-template#399).
  # A genuine infrastructure failure in the "Fetch the mif-rh-cli engine"
  # step below (e.g. attestation verification failing) is left to fail this
  # job normally — that step isn't wrapped in any soft-failure handling.
  # Only the final reconcile-check step is soft (see its own comment for why
  # it can't distinguish "drift found" from "the engine hit a real error").
  changelog-links-check:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # needs full tag history, not a shallow clone

      - name: Fetch the mif-rh-cli engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-engine.sh

      - name: Check CHANGELOG footer-link reconciliation
        run: |
          set -uo pipefail
          # GitHub Actions runs `run:` steps under `bash -e` by default, so
          # capturing `bin/mif-rh-cli ...`'s exit code needs `set +e` around
          # it — otherwise `-e` aborts the step on the very first non-zero
          # exit before `code=$?` ever runs, turning the intended soft
          # warning into a hard job failure. (Two things verified
          # empirically before landing this: wrapping the command in a bare
          # `if cmd; then …; fi` with no `else` does NOT work either — `$?`
          # after such an `if` is unconditionally 0, not the tested
          # command's real exit status. And `--check`'s "drift found" exit
          # and a genuine internal error both currently exit 1 — the CLI has
          # no distinct code for the two — so this deliberately does not try
          # to tell them apart via exit code; any non-zero exit gets the
          # same soft warning, which is the right call for a job nothing
          # else `needs:`.)
          set +e
          bin/mif-rh-cli harness reconcile-changelog-links --check
          code=$?
          set -e
          if [ "${code}" -ne 0 ]; then
            echo "::warning::mif-rh-cli harness reconcile-changelog-links --check reported an issue (exit ${code}) — CHANGELOG.md may need heading-bracket/footer-link reconciliation, or the engine hit a real error; run it locally to see which, then open a follow-up PR if reconciliation is needed (research-harness-template#397)."
          fi
