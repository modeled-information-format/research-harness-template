name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # SCA: OSV-Scanner + dependency-review, as a thin caller of the org central
  # reusable (consume, never reinvent).
  sca:
    permissions:
      actions: read
      contents: read
      security-events: write
      pull-requests: write
    uses: modeled-information-format/.github/.github/workflows/reusable-sca-osv.yml@f83ee8058630235396f7242580570b26cf3617fa
    with:
      fail-on-severity: high

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Mint a CI app token (public-artifact reads — yq, mif-rh-cli)
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CI_CLIENT_APP_ID }}
          private-key: ${{ secrets.CI_CLIENT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: research-harness-template
          permission-contents: read

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install toolchain
        run: |
          # Package-manager installs are integrity-verified against the registry by
          # the manager itself (npm SHA-512 integrity, pip hashes) — verification is
          # built into the download.
          npm install -g ajv-cli ajv-formats markdownlint-cli2
          pipx install copier

      - name: Install yq (verified download — attestation -> checksum waterfall)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Supply-chain policy: a raw binary download MUST be verified. Prefer a
          # GitHub build-provenance attestation; when upstream publishes none
          # (mikefarah/yq does not), relax to the minimum — a pinned SHA-256 cross-
          # checked against the upstream signed `checksums`. Refuse to install if
          # neither passes. yq is pinned (not "latest") so the digest is stable.
          YQ_VERSION=v4.53.3
          YQ_SHA256=fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
          curl -fsSL -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          if gh attestation verify /tmp/yq --repo mikefarah/yq >/dev/null 2>&1; then
            echo "yq ${YQ_VERSION}: verified via gh build-provenance attestation"
          elif echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -; then
            echo "yq ${YQ_VERSION}: no upstream attestation — verified via pinned SHA-256 (checksum floor)"
          else
            echo "yq ${YQ_VERSION}: VERIFICATION FAILED — refusing to install" >&2
            exit 1
          fi
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq

      - name: Tool versions
        run: |
          node --version
          python3 --version
          jq --version
          yq --version
          ajv help >/dev/null 2>&1 && echo "ajv-cli present"
          markdownlint-cli2 --version
          copier --version

      - name: model codegen in sync (regenerate from schemas, fail if committed models drift)
        run: CHECK=1 bash scripts/codegen/gen-models.sh  # self-provisions a pinned venv

      - name: fetch the mif-rh engine (ADR-0016; attested, fail-closed)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash scripts/fetch-engine.sh

      - name: vendor enabled domain ontologies on demand (ADR-0012; before verify)
        # Must run AFTER the engine is installed: fetch-ontology.sh now
        # delegates to mif-rh-cli (Story #277 jq cutover) and hard-requires
        # it, same as resolve-ontology.sh/ontology-review.sh already did.
        run: bash scripts/fetch-ontology.sh --all-enabled  # sha256-verified; pins ontologies.lock.json

      - name: verify.sh (build gate — schemas, citation gate, per-milestone gates, evals)
        # evals/copier-update.sh instantiates a fresh copier clone whose own
        # `_tasks` re-runs `bash scripts/fetch-engine.sh` for that instance
        # (real end users need this on every fresh instantiation); that
        # nested fetch calls `gh`, which needs GH_TOKEN in Actions (a
        # runner has no persistent gh auth the way a workstation does).
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash scripts/verify.sh

      - name: eval suite (shipped + run in CI)
        run: bash evals/run-evals.sh

      - name: copier update propagation
        # Same nested-fetch-engine GH_TOKEN need as the verify.sh step above
        # (this runs evals/copier-update.sh directly, a second time, as its
        # own independently-reported gate — see the markdownlint job's
        # "Defect 3" comment below for why it's a separate step from
        # verify.sh's own internal check).
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash evals/copier-update.sh

  markdownlint:
    # Run in a SEPARATE job so an earlier failing gate can never mask it. Issue #85
    # Defect 3: in an instance the `copier update propagation` step failed and, being
    # in the same job before this gate, aborted CI before markdownlint ran — hiding
    # 46 markdown violations across 8+ pushes. An independent job always runs.
    # (markdownlint-cli2 also stays installed in the `verify` job above because the
    # eval suite's progress-log lint check depends on it.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2

      - name: markdownlint (G5 — 0 errors)
        # Pass the project config explicitly (matching the md_guard hook and the
        # eval suite) so the ruleset is applied deterministically regardless of
        # cli2's implicit config discovery.
        run: markdownlint-cli2 --config .markdownlint-cli2.jsonc "**/*.md"

  version-bump:
    # Change-driven versioning enforcement (ADR-0010, amended): a changed pack or
    # core skill must move its own version (per-PR, diffed against the base
    # branch), and the release pointer (harness.config.json) must stay strictly
    # ahead of the last git tag release — a per-release invariant, not a per-PR
    # one, so two PRs opened off the same base never collide over who bumps it.
    # PR-only.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Mint a CI app token (public-artifact read — mif-rh-cli)
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CI_CLIENT_APP_ID }}
          private-key: ${{ secrets.CI_CLIENT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: research-harness-template
          permission-contents: read

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags origin "$BASE_REF"

      - name: fetch the mif-rh engine (ADR-0016; attested, fail-closed)
        # check-version-bump.sh delegates to the engine (Story #298); this
        # job runs in its own fresh checkout, so it needs its own fetch,
        # same as the "verify" job's own step.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash scripts/fetch-engine.sh

      - name: Versions bumped as required (change-driven, ADR-0010)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/check-version-bump.sh "origin/$BASE_REF"

  pin-check:
    # Supply-chain gate: every GitHub Actions `uses:` across all workflow files
    # must be pinned to a full 40-char commit SHA (a tag/branch ref is mutable
    # and re-pointable). Fails closed if any unpinned action is found.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: All actions are SHA-pinned
        run: |
          set -euo pipefail
          # Match only real `uses:` step keys (optionally `- ` prefixed) at the
          # start of a line, so commented examples never trip the gate.
          unpinned=$(grep -rhoE '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]+\S+@\S+' .github/workflows/ | grep -ivE '@[0-9a-f]{40}' || true)
          if [ -n "${unpinned}" ]; then
            echo "Unpinned actions found (pin to a 40-char commit SHA):" >&2
            echo "${unpinned}" >&2
            exit 1
          fi
          echo "pin-check: every action is pinned to a 40-char commit SHA"
