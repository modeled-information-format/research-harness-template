name: continuous-monitoring-gate

# Phase 2 (research-harness-template#424, ADR-0019): reacts to a
# continuous-monitoring review PR (opened by monitor.yml) actually
# closing. Per ADR-0019, that PR IS the Editorial Gate
# (research-harness-template#422): merged == true is the accept path,
# closed-without-merge is the reject path. Runs editorial-gate.sh and
# output-router.sh, then commits the result directly to main -- this runs
# only AFTER the human review the PR represents has already happened, so
# no further review gate applies here.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  gate-and-publish:
    if: startsWith(github.event.pull_request.head.ref, 'monitor/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install toolchain (ajv-cli -- continuity-log.sh's schema gate hard-requires it)
        run: npm install -g ajv-cli ajv-formats

      - name: "Mint an app token (write: contents)"
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTOMERGE_CLIENT_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_CLIENT_APP_PRIVATE_KEY }}
          # owner/repositories deliberately omitted: the action then
          # scopes the token to exactly the current repository, whatever
          # its name -- these workflows are installed into copier
          # instances whose repo name differs (#517), and a hard-coded
          # name would mint for the wrong repo (schedule events also
          # carry no reliable event.repository payload).
          permission-contents: write

      - name: fetch the mif-rh engine (ADR-0016)
        env:
          # #662: mif-rh-cli/mif-rh-mcp come from mif-rs, a repo this job
          # never otherwise touches (every other step here only needs the
          # local checkout + this job's own write identity, below). The
          # `automerge` app token above is scoped to exactly this repo (its
          # `owner`/`repositories` inputs are deliberately omitted here —
          # see that step's own comment) and, like any GitHub App
          # installation token restricted to a repository list, 404s on any
          # repo outside that list even when it's public. The default job
          # token carries no such installation-repo-list restriction and
          # reads mif-rs's public release + attestation data directly (same
          # pattern as release.yml's changelog-links-check job and
          # ci.yml's fetch-engine steps).
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-engine.sh

      - name: parse topic and run-id, gate and publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Untrusted (PR head ref / base ref / head sha are attacker-
          # influenceable): passed through env vars, never interpolated
          # directly into the script, per actionlint's script-injection
          # guidance.
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
        run: |
          set -euo pipefail
          # monitor/<subject>/<run-id> -- <subject> is a monitoringDomains[]
          # id or a topic id (#521); the run-dir mapping mirrors
          # run-monitoring.sh's.
          TOPIC="$(printf '%s' "$PR_HEAD_REF" | cut -d/ -f2)"
          RUN_ID="$(printf '%s' "$PR_HEAD_REF" | cut -d/ -f3-)"
          # Validate BOTH branch-derived segments before they touch any
          # path (git show's REC_PATH below) -- run-gate-and-publish.sh
          # re-checks, but that runs after this script has already
          # interpolated them.
          case "$TOPIC" in ""|*/*|*..*) echo "monitor-gate.yml: invalid subject id from head ref: $TOPIC" >&2; exit 1 ;; esac
          case "$RUN_ID" in ""|*/*|*..*) echo "monitor-gate.yml: invalid run id from head ref: $RUN_ID" >&2; exit 1 ;; esac
          if jq -e --arg d "$TOPIC" '(.monitoringDomains // [])[] | select(.id == $d)' harness.config.json >/dev/null 2>&1; then
            SUBJECT_DIR="reports/_monitoring/$TOPIC"
            REC_PATH="reports/_monitoring/$TOPIC/runs/$RUN_ID/recommendations.json"
          else
            SUBJECT_DIR="reports/$TOPIC"
            REC_PATH="reports/$TOPIC/monitoring/runs/$RUN_ID/recommendations.json"
          fi

          # recommendations.json only ever exists on the PR's own head
          # commit -- it reaches the base branch ONLY once the PR is
          # merged. On the reject path (closed without merge) it is NEVER
          # on $PR_BASE_REF, so read it from the head commit directly
          # (fetchable by SHA even if the branch ref itself was deleted on
          # close) rather than assuming it's already checked out.
          git fetch origin "$PR_HEAD_SHA"
          REC_FILE="$(mktemp).json"
          if ! git show "$PR_HEAD_SHA:$REC_PATH" > "$REC_FILE" 2>/dev/null; then
            echo "monitor-gate.yml: $REC_PATH not found at $PR_HEAD_SHA" >&2
            exit 1
          fi

          bash packs/monitoring/continuous-monitor/scripts/run-gate-and-publish.sh "$TOPIC" "$RUN_ID" "$REC_FILE" "$PR_MERGED"

          git config user.name "research-harness-template[bot]"
          git config user.email "research-harness-template[bot]@users.noreply.github.com"
          # Without this, git push falls back to the checkout's default
          # credential instead of the minted app token in GH_TOKEN -- see
          # the identical note in monitor.yml.
          gh auth setup-git
          # The gate can touch the subject's own dir, a bound topic's dir
          # (a domain's projectToTopic publish), and the shared
          # prior-coverage memory (#523) -- stage exactly those, each only
          # if present.
          PUBLISH_TOPIC="$(jq -r --arg d "$TOPIC" 'first(((.monitoringDomains // [])[] | select(.id == $d) | .projectToTopic // empty), $d)' harness.config.json)"
          for p in "$SUBJECT_DIR" "reports/$PUBLISH_TOPIC" reports/_monitoring/prior-coverage.jsonl; do
            [ -e "$p" ] && git add "$p"
          done
          if ! git diff --cached --quiet; then
            git commit -m "monitor($TOPIC): gate decision for $RUN_ID (merged=$PR_MERGED)"
            git push origin "$PR_BASE_REF"
          fi
