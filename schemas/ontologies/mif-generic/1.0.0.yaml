# mif-generic — the basic generic ontology, ALWAYS enabled for every topic.
# Harness-authored from MIF's built-in entity types (the mif.schema entity-reference
# enum: Concept, Person, Organization, Technology, File), expressed as ontology
# entity_types so any finding in any topic can be classified to a generic type even
# with no domain ontology bound. Domain ontologies (packs/ontologies/) add more
# specific types on top; where a name collides, the finding must name ontology.id.
ontology:
  id: mif-generic
  version: 1.0.0
  description: Basic generic ontology (MIF built-in entity types); always enabled for all topics.
  extends:
    - mif-base
# Enrichment scope (ADR-0015 / MIF ADR-020): aliases/exemplars are added to
# the types that carry meaningful stamped-finding volume in the reference
# corpus (concept, technology, organization). person and file are
# deliberately unenriched until calibration data shows they need it;
# authoring embedding signal without corpus grounding would be guesswork.
entity_types:
  - name: concept
    base: semantic
    description: An abstract idea, theme, method, or topic.
    aliases:
      - "idea"
      - "principle"
      - "theme"
      - "definition"
      - "theoretical model"
      - "analytical distinction"
    exemplars:
      - "An abstract analytical distinction between two competing approaches to a problem"
      - "A named principle or requirement drawn from a published standard or specification"
      - "A theoretical model expressing how a quantity depends on underlying parameters"
      - "A definitional clarification of what a specification does and does not require"
    schema:
      required: [name]
      properties:
        name: { type: string, description: Concept name }
  - name: person
    base: semantic
    description: An individual human actor.
    schema:
      required: [name]
      properties:
        name: { type: string, description: Person name }
  - name: organization
    base: semantic
    description: A company, institution, agency, or group.
    aliases:
      - "standards organization"
      - "open-source foundation"
      - "governing body"
      - "industry working group"
    exemplars:
      - "A working group under a security foundation publishes baseline security-maturity frameworks for package registries"
      - "A specification and tooling initiative for event-driven API contracts is hosted under a vendor-neutral open-source foundation"
      - "A commercial sponsor stewards an open-source contract-testing ecosystem's governance in a vendor-neutral, community-directed manner"
    schema:
      required: [name]
      properties:
        name: { type: string, description: Organization name }
  - name: technology
    base: semantic
    description: A tool, system, framework, standard, or product.
    aliases:
      - "tool"
      - "product"
      - "platform"
      - "library"
      - "software system"
      - "named framework"
    exemplars:
      - "An open-source command-line tool that renders declarative specifications without a browser"
      - "A vendor product integration adding policy enforcement at the infrastructure level"
      - "A protocol gateway enabling cost tracking across heterogeneous frameworks"
      - "A managed service or library adopted for a specific engineering capability"
    schema:
      required: [name]
      properties:
        name: { type: string, description: Technology name }
  - name: file
    base: semantic
    description: A document, dataset, or artifact.
    schema:
      required: [name]
      properties:
        name: { type: string, description: File name or path }
relationships: {}
