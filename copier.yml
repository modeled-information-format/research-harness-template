# Copier template configuration (SPEC §7). The harness is distributed as a
# living, update-propagating template: `copier copy` instantiates it and
# `copier update` re-applies later template improvements to an already-
# instantiated harness (the decisive differentiator over snapshot engines).
#
# Only *.jinja files are rendered (suffix stripped on generation); every other
# file in the repo is copied verbatim, so the harness's own contracts, scripts,
# agents, and gates travel unchanged and the template repo keeps passing its own
# gates. The one file a clone then edits by hand is harness.config.json.

_templates_suffix: ".jinja"
_answers_file: ".copier-answers.yml"
_subdirectory: "."

# Files that must never be copied into an instantiated harness.
_exclude:
  - "copier.yml"
  - ".git"
  - ".github/workflows/*"  # the template's own CI; instances opt in separately.
                           # The continuous-monitor pack's workflows are NOT
                           # lost to this exclude: their canonical sources ship
                           # inside the pack (packs/monitoring/continuous-monitor/
                           # workflows/) and `scripts/install-monitoring-workflows.sh`
                           # materializes them into an instance (#517).
  - "node_modules"
  - "**/__pycache__"
  - "*.pyc"
  - ".venv-codegen"          # dev/build-time codegen venv; generated models under lib/ are shipped
  - "PROGRESS.md"            # the template's build log, not the instance's
  - "COMPLETION-CRITERIA.md"
  - "IMPLEMENTATION-PLAN.md"
  # NOTE: reports/example-okf-mif-knowledge-spine/ is intentionally NOT excluded. The
  # template serves this single ARCHIVED example research topic straight out of reports/
  # as its worked showcase, and clones inherit it under the SAME name as their seed
  # fixture. It is shipped as ordinary template content (no rename task): copier re-applies
  # the unchanged corpus on `copier update` with no conflict, and keeping the directory
  # name stable avoids churning copier's throwaway update render (a rename there
  # intermittently breaks copier's temp-dir cleanup).

# Instantiation Q&A.
project_name:
  type: str
  help: "Name of your research harness"
  default: "research-harness"

author_name:
  type: str
  help: "Your name or organization (the harness owner)"
  default: "zircote"

# Post-generation tasks (run only with `copier copy --trust` / `copier update --trust`):
#   1. site-toggle: a clone's primary local mode of consuming its research is the
#      Astro/Starlight site rendering reports/, so flip the site to reports-primary
#      (the template itself ships docs-primary). Edits only `.site.primarySurface`.
#   2. site symlinks: re-establish docs/reports + src/content/docs, which copier
#      flattens into real dirs on render, so the Astro content collection resolves.
#   3. sync-packs: regenerate the derived ontology catalog (.claude/enabled-packs.json) on copy
#      AND update, so an update never leaves it stale (issue #200).
# The archived example topic (reports/example-okf-mif-knowledge-spine) ships to clones
# AS-IS as their inherited seed fixture — it keeps its name everywhere. There is NO
# rename task: renaming the corpus directory inside copier's throwaway update render
# churns the tree and destabilizes copier's temp-dir cleanup (it intermittently fails
# to remove new_copy/.git), so we leave the topic name unchanged.
_tasks:
  # Every task below except the two symlink re-establishments delegates to the
  # mif-rh engine (mif-rh-cli) and hard-requires it: site-toggle.sh itself
  # since research-harness-template#276 (Story #302, Category B cutover), and
  # fetch-ontology.sh/sync-packs.sh since Story #277's jq cutover. This MUST
  # run first, before site-toggle.sh below — provisioning it after the first
  # engine-requiring task defeats the purpose (research-harness-template#733:
  # a fresh instance with no cached bin/mif-rh-cli fails site-toggle.sh with
  # exit 5 on every `copier copy`/`copier update`, since fetch-engine.sh used
  # to sit fourth in this list, after the one task that needed it first). A
  # no-op if already installed/on PATH/MIF_RH_CLI-overridden
  # (scripts/lib/engine.sh's own resolution order).
  - "bash scripts/fetch-engine.sh"
  - "bash scripts/site-toggle.sh primary reports"
  # Copier renders symlinked directories as real dirs; re-establish the two
  # site symlinks so the Astro content collection reaches docs/ and reports/.
  - "rm -rf docs/reports && ln -s ../reports docs/reports"
  - "rm -rf src/content/docs && ln -s ../../docs src/content/docs"
  # Vendor the enabled domain ontologies on demand from the canonical registry
  # (ADR-0012): domain packs are NOT bundled — they are fetched + sha256-verified
  # into packs/ontologies/<id>/ and pinned in ontologies.lock.json before the
  # catalog is built. Base layers ship committed under schemas/ontologies/.
  # (#224. Override the source for dev/CI/offline with $MIF_ONTOLOGY_SOURCE.)
  - "bash scripts/fetch-ontology.sh --all-enabled"
  # Regenerate the derived ontology catalog (.claude/enabled-packs.json) on copy AND update,
  # so an update never leaves it stale — a stale catalog missing an `extends` target makes the
  # fail-closed resolver mark the whole bound corpus invalid (issue #200).
  - "bash scripts/sync-packs.sh"

_message_after_copy: |
  Your research harness is ready.

  The Astro/Starlight site renders your reports/ for local human reading and is
  set to reports-primary. Read your reports with:

      npm install
      npm run dev        # or: npm run preview   (after `npm run build`)

  Change which surface leads or toggle site plugins any time:

      bash scripts/site-toggle.sh primary <reports|docs|auto>
      bash scripts/site-toggle.sh plugin <imageZoom|linksValidator|llmsTxt|mermaid> <on|off>

  Your harness ships with one archived seed topic — `example-okf-mif-knowledge-spine`, a
  worked OKF + MIF knowledge-spine research corpus (findings, knowledge graph, and a full
  set of genre reports) — so you can see the engine's output immediately. Browse it under
  reports/example-okf-mif-knowledge-spine/, then run `/start` to research your own first topic.
